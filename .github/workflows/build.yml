name: Android Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        run: ./gradlew assembleDebug 2>&1 | tee build-output.log

      - name: Save error log
        if: failure()
        run: |
          echo '{' > build-report.json
          echo '  "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'",' >> build-report.json
          echo '  "branch": "'"${GITHUB_REF_NAME}"'",' >> build-report.json
          echo '  "commit": "'"${GITHUB_SHA}"'",' >> build-report.json
          echo '  "workflow_run": "'"${GITHUB_RUN_ID}"'",' >> build-report.json
          echo '  "log": ' >> build-report.json
          python3 -c "import json, sys; print(json.dumps(open('build-output.log').read()))" >> build-report.json
          echo '}' >> build-report.json

      - name: Commit error report
        if: failure()
        run: |
          git config user.email "ci@bot"
          git config user.name "CI Bot"
          git add build-report.json
          git commit -m "ci: build report [skip ci]"
          git push
